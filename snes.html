<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Nintendo (SNES) Hub</title>
    
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F1F1F1" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- JSNES Emulator Core über CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/1.2.0/jsnes.min.js"></script>

    <style>
        :root {
            --bg-color: #161616;
            --card-bg: #2A2A2A;
            --text-color: #FFFFFF;
            --tile-border: rgba(255, 255, 255, 0.08);
            --subtext-color: #AAAAAA;
            --hover-bg: rgba(255, 255, 255, 0.07);
            --accent-blue: #007AFF;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #F1F1F1;
                --card-bg: #FFFFFF;
                --text-color: #111111;
                --tile-border: rgba(0, 0, 0, 0.08);
                --subtext-color: #888888;
                --hover-bg: rgba(0, 0, 0, 0.05);
            }
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--tile-border);
        }

        .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--tile-border);
            color: var(--text-color);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover {
            background: var(--hover-bg);
        }

        .page-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--tile-border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-blue);
        }

        .game-cover-wrapper {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: #111;
        }

        .game-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .game-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .game-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-sys {
            font-size: 10px;
            color: var(--subtext-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .emulator-container {
            display: none;
            width: 100%;
            background: #000;
            border-radius: 16px;
            border: 1px solid var(--tile-border);
            overflow: hidden;
            flex-direction: column;
            align-items: center;
        }

        .emulator-container.active {
            display: flex;
        }

        .emulator-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 10px 16px;
            border-bottom: 1px solid var(--tile-border);
        }

        .emulator-screen {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #000;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            height: auto;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <a href="retro.html" class="back-btn">&#8249; Retro Hub</a>
            <h1 class="page-title">🍄 Super Nintendo (SNES)</h1>
            <div style="width: 70px;"></div>
        </div>

        <div class="game-grid" id="snesGameGrid"></div>

        <div class="emulator-container" id="emulatorContainer">
            <div class="emulator-header">
                <span id="activeGameTitle" style="font-weight: 700; font-size: 14px;">Spiel läuft...</span>
                <button class="back-btn" onclick="closeEmulator()">Spiel beenden</button>
            </div>
            <div class="emulator-screen">
                <canvas id="emscripten_canvas" width="256" height="224"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Automatischer Basis-Pfad für GitHub Pages (berücksichtigt das /tesla-apps/ Repository)
        const repoBase = window.location.hostname.includes('github.io') ? '/tesla-apps' : '';

        const snesGames = [
            { 
                id: "supermario", 
                name: "Super Mario World", 
                cover: repoBase + "/roms/snes/super_mario_world.png", 
                rom: repoBase + "/roms/snes/super_mario_world.smc" 
            },
            { 
                id: "zelda", 
                name: "Zelda: A Link to the Past", 
                cover: repoBase + "/roms/snes/zelda.png", 
                rom: repoBase + "/roms/snes/zelda.smc" 
            },
            { 
                id: "mariokart", 
                name: "Super Mario Kart", 
                cover: repoBase + "/roms/snes/mario_kart.png", 
                rom: repoBase + "/roms/snes/mario_kart.smc" 
            },
            { 
                id: "metroid", 
                name: "Super Metroid", 
                cover: repoBase + "/roms/snes/super_metroid.png", 
                rom: "roms/snes/super_metroid.smc" 
            }
        ];

        let nes = null;
        let animationFrameId = null;

        function renderSnesGames() {
            const grid = document.getElementById('snesGameGrid');
            grid.innerHTML = '';

            snesGames.forEach(game => {
                let card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => launchSnesGame(game);
                card.innerHTML = `
                    <div class="game-cover-wrapper">
                        <img src="${game.cover}" alt="${game.name}" class="game-cover">
                    </div>
                    <div class="game-info">
                        <span class="game-name">${game.name}</span>
                        <span class="game-sys">SNES Cartridge</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function launchSnesGame(game) {
            document.getElementById('snesGameGrid').style.display = 'none';
            document.getElementById('emulatorContainer').classList.add('active');
            document.getElementById('activeGameTitle').innerText = game.name;

            try {
                // ROM-Datei mit absolutem Repository-Pfad laden
                let response = await fetch(game.rom);
                if (!response.ok) throw new Error("HTTP Fehler " + response.status);
                let buffer = await response.arrayBuffer();
                let romData = new Uint8Array(buffer);

                // Canvas initialisieren
                const canvas = document.getElementById('emscripten_canvas');
                const ctx = canvas.getContext('2d');
                let image = ctx.createImageData(canvas.width, canvas.height);

                nes = new jsnes.NES({
                    onFrame: function(frameData) {
                        for (let i = 0; i < frameData.length; i++) {
                            image.data[i * 4] = (frameData[i] & 0xFF0000) >> 16;
                            image.data[i * 4 + 1] = (frameData[i] & 0x00FF00) >> 8;
                            image.data[i * 4 + 2] = (frameData[i] & 0x0000FF);
                            image.data[i * 4 + 3] = 0xFF;
                        }
                        ctx.putImageData(image, 0, 0);
                    },
                    audioSampleRate: 44100
                });

                // ROM laden und starten
                nes.loadROM(romData);
                runEmulation();

            } catch (err) {
                console.error("Fehler beim Laden der ROM:", err);
                alert("ROM konnte nicht geladen werden. Prüfe den Pfad: " + game.rom);
            }
        }

        function runEmulation() {
            if (!nes) return;
            nes.frame();
            animationFrameId = requestAnimationFrame(runEmulation);
        }

        function closeEmulator() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            nes = null;
            document.getElementById('emulatorContainer').classList.remove('active');
            document.getElementById('snesGameGrid').style.display = 'grid';
        }

        renderSnesGames();
    </script>
</body>
</html>
