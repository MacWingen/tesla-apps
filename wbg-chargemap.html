<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WBG Chargemap</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: #1f2937; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #10b981; cursor: pointer; box-shadow: 0 0 8px rgba(16, 185, 129, 0.5); }
    </style>
</head>
<body class="bg-black text-gray-100 h-screen flex flex-col items-center justify-center overflow-hidden text-xs font-sans">

    <!-- App Container -->
    <div class="w-full h-full max-w-xl bg-gray-950 border-x border-gray-900 flex flex-col shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <div class="px-4 py-3 border-b border-gray-900 flex items-center justify-between bg-gray-950/80 backdrop-blur shrink-0">
            <div class="flex items-center space-x-2.5">
                <div class="bg-emerald-500/10 border border-emerald-500/20 p-2 rounded-xl text-emerald-400">
                    <i class="fa-solid fa-bolt text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-tight text-gray-100">WBG Chargemap</h1>
                    <span class="text-[10px] text-emerald-400 font-medium" id="weatherInfoBadge">Lünen: --°C</span>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[11px] font-bold text-emerald-400 block">0,38 €/kWh</span>
                <span class="text-[9px] text-gray-500 block truncate max-w-[140px]" id="locationLabel">Winkel 13, Lünen</span>
            </div>
        </div>

        <!-- Dashboard / Rechner (Clean & Modern) -->
        <div class="p-3 bg-gray-900/50 border-b border-gray-900 space-y-2.5 shrink-0">
            
            <!-- Hero Result Box (Fertig, Ladezeit & Kosten) -->
            <div class="bg-gradient-to-r from-blue-950/40 to-emerald-950/40 border border-blue-500/20 rounded-2xl p-2.5 flex items-center justify-between shadow-inner">
                <div>
                    <span class="text-[10px] uppercase tracking-wider text-blue-400 font-semibold block">Fertig um</span>
                    <strong id="topFinishTime" class="text-base font-black text-white tracking-tight">--:--</strong>
                    <span class="text-[10px] text-gray-400 block" id="topDuration">Ladezeit: --</span>
                </div>
                <div class="text-right border-l border-gray-800/80 pl-4">
                    <span class="text-[10px] uppercase tracking-wider text-emerald-400 font-semibold block">Gesamtkosten</span>
                    <strong id="topCostVal" class="text-lg font-black text-emerald-400 tracking-tight">--,---</strong> <span class="text-xs text-emerald-400 font-bold">€</span>
                </div>
            </div>

            <!-- Akku & Schnellwahl -->
            <div class="flex items-center justify-between pt-0.5">
                <div class="flex items-center space-x-1.5 bg-gray-950 border border-gray-800/80 rounded-xl px-2.5 py-1">
                    <span class="text-gray-400 text-[11px]">Akku:</span>
                    <input type="number" id="batterySizeInput" value="60" min="10" max="200" step="1" oninput="calculateAll()" class="w-9 bg-transparent text-right font-bold text-emerald-400 outline-none text-xs">
                    <span class="text-gray-500 text-[10px]">kWh</span>
                </div>
                <div class="flex space-x-1">
                    <button onclick="setBatterySize(40)" class="bg-gray-900 hover:bg-gray-800 border border-gray-800 text-gray-300 px-2 py-1 rounded-lg text-[10px] font-semibold transition">40</button>
                    <button onclick="setBatterySize(60)" class="bg-gray-900 hover:bg-gray-800 border border-gray-800 text-gray-300 px-2 py-1 rounded-lg text-[10px] font-semibold transition">60</button>
                    <button onclick="setBatterySize(75)" class="bg-gray-900 hover:bg-gray-800 border border-gray-800 text-gray-300 px-2 py-1 rounded-lg text-[10px] font-semibold transition">75</button>
                    <button onclick="setBatterySize(100)" class="bg-gray-900 hover:bg-gray-800 border border-gray-800 text-gray-300 px-2 py-1 rounded-lg text-[10px] font-semibold transition">100</button>
                </div>
            </div>

            <!-- Slider SoC (Von / Bis) -->
            <div class="bg-gray-950/60 border border-gray-800/50 rounded-xl p-2 space-y-1.5">
                <div class="flex justify-between text-[11px]">
                    <span class="text-gray-400">Start SoC: <strong id="startVal" class="text-gray-200">20%</strong></span>
                    <span class="text-gray-400">Ziel SoC: <strong id="targetVal" class="text-emerald-400">80%</strong></span>
                </div>
                <div class="flex space-x-3 px-1">
                    <input type="range" id="startSoc" min="0" max="95" value="20" oninput="calculateAll()" class="w-1/2">
                    <input type="range" id="targetSoc" min="5" max="100" value="80" oninput="calculateAll()" class="w-1/2">
                </div>
            </div>
        </div>

        <!-- Standort & Stadt-Filter -->
        <div class="p-3 border-b border-gray-900 space-y-2 bg-gray-950 shrink-0">
            <div class="relative flex items-center">
                <input type="text" id="searchInput" placeholder="Startpunkt (PLZ/Adresse)..." value="Winkel 13, 44536 Lünen"
                    class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 pl-8 text-xs focus:outline-none focus:border-emerald-500 transition">
                <i class="fa-solid fa-map-pin absolute left-3 text-gray-500 text-[11px]"></i>
                <button id="searchBtn" class="absolute right-1.5 bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg text-xs transition font-semibold">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            
            <!-- Filter & Aktionen -->
            <div class="flex items-center justify-between overflow-x-auto pb-0.5 text-[10px] custom-scrollbar space-x-1">
                <div class="flex items-center space-x-1 shrink-0">
                    <button onclick="setCityFilter('Alle')" id="filter-Alle" class="bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-bold shrink-0 transition">Alle</button>
                    <button onclick="setCityFilter('Lünen')" id="filter-Lünen" class="bg-gray-900 hover:bg-gray-800 text-gray-300 px-2.5 py-1 rounded-lg shrink-0 transition">Lünen</button>
                    <button onclick="setCityFilter('Kamen')" id="filter-Kamen" class="bg-gray-900 hover:bg-gray-800 text-gray-300 px-2.5 py-1 rounded-lg shrink-0 transition">Kamen</button>
                    <button onclick="setCityFilter('Werne')" id="filter-Werne" class="bg-gray-900 hover:bg-gray-800 text-gray-300 px-2.5 py-1 rounded-lg shrink-0 transition">Werne</button>
                    <button onclick="setCityFilter('Bergkamen')" id="filter-Bergkamen" class="bg-gray-900 hover:bg-gray-800 text-gray-300 px-2.5 py-1 rounded-lg shrink-0 transition">Bergkamen</button>
                    <button onclick="setCityFilter('Selm')" id="filter-Selm" class="bg-gray-900 hover:bg-gray-800 text-gray-300 px-2.5 py-1 rounded-lg shrink-0 transition">Selm</button>
                </div>
                <div class="flex items-center space-x-1 shrink-0 pl-1 border-l border-gray-800">
                    <button id="gpsBtn" class="bg-gray-900 hover:bg-gray-800 text-emerald-400 px-2.5 py-1 rounded-lg flex items-center space-x-1 transition font-medium" title="GPS nutzen">
                        <i class="fa-solid fa-location-crosshairs"></i>
                    </button>
                    <button id="refreshBtn" class="bg-gray-900 hover:bg-gray-800 text-gray-400 px-2.5 py-1 rounded-lg flex items-center space-x-1 transition" title="Reset">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Zähler -->
        <div class="px-4 py-1.5 bg-gray-950 border-b border-gray-900 text-[10px] text-gray-500 shrink-0 flex justify-between items-center font-medium">
            <span id="stationCount">Lade Standorte...</span>
            <span>Sortiert nach Entfernung</span>
        </div>

        <!-- Stationsliste -->
        <div id="stationList" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2">
            <!-- Dynamisch -->
        </div>

    </div>

    <!-- JavaScript Logik -->
    <script>
        let userLat = 51.5974;
        let userLon = 7.4561; 
        let currentFilter = 'Alle';
        let wbgStations = [];
        let favorites = JSON.parse(localStorage.getItem('wbg_favorites')) || [];
        let currentLossFactor = 1.07;

        const rawWbgData = [
            { id: 'winkel13', title: 'Winkel 13 (Deine Säule)', address: 'Winkel 13, 44536 Lünen', lat: 51.5974, lon: 7.4561, power: '11 kW AC', price: 0.38, custom: true, city: 'Lünen' },
            { id: 'asternweg2', title: 'Asternweg 2', address: 'Asternweg 2, 44536 Lünen', lat: 51.6234, lon: 7.5112, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'vogelsberg', title: 'Am Vogelsberg 106', address: 'Am Vogelsberg 106, 44532 Lünen', lat: 51.6158, lon: 7.5365, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'bebelstr', title: 'Bebelstraße 188', address: 'Bebelstraße 188, 44532 Lünen', lat: 51.5962, lon: 7.5215, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'christianstr', title: 'Christian-Morgenstern-Str. 9', address: 'Christian-Morgenstern-Straße 9, Lünen', lat: 51.6112, lon: 7.5168, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'kurtstr', title: 'Kurt-Schumacher-Straße 11', address: 'Kurt-Schumacher-Straße 11, Lünen', lat: 51.6041, lon: 7.5180, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'luisenstr', title: 'Luisenhüttenstraße 24', address: 'Luisenhüttenstraße 24, 44532 Lünen', lat: 51.6192, lon: 7.5325, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'moltkestr', title: 'Moltkestraße 75', address: 'Moltkestraße 75, 44532 Lünen', lat: 51.6105, lon: 7.5222, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'nelkenweg', title: 'Nelkenweg 6', address: 'Nelkenweg 6, 44536 Lünen', lat: 51.6225, lon: 7.5132, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'ottoklug', title: 'Otto-Klug-Weg 14', address: 'Otto-Klug-Weg 14, 44532 Lünen', lat: 51.6092, lon: 7.5415, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'parkstr', title: 'Parkstraße 19', address: 'Parkstraße 19, 44532 Lünen', lat: 51.6052, lon: 7.5338, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'schachtweg', title: 'Schachtweg 8b', address: 'Schachtweg 8 b, 44532 Lünen', lat: 51.6012, lon: 7.5298, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'schulstr', title: 'Schulstraße 76', address: 'Schulstraße 76, 44532 Lünen', lat: 51.6142, lon: 7.5195, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'wilhelmallee', title: 'Wilhelm-Löbbe-Allee 24', address: 'Wilhelm-Löbbe-Allee 24, 44532 Lünen', lat: 51.6062, lon: 7.5268, power: '11 kW AC', price: 0.38, city: 'Lünen' },
            { id: 'goldbach', title: 'Goldbach 51 (Kamen)', address: 'Goldbach 51, 59174 Kamen', lat: 51.5855, lon: 7.6635, power: '11 kW AC', price: 0.38, city: 'Kamen' },
            { id: 'grillostr', title: 'Grillostraße 103 (Kamen)', address: 'Grillostraße 103, 59174 Kamen', lat: 51.5892, lon: 7.6668, power: '11 kW AC', price: 0.38, city: 'Kamen' },
            { id: 'lessingstr', title: 'Lessingstraße 6 (Kamen)', address: 'Lessingstraße 6, 59174 Kamen', lat: 51.5912, lon: 7.6610, power: '11 kW AC', price: 0.38, city: 'Kamen' },
            { id: 'westickerstr', title: 'Westicker Straße 16 (Kamen)', address: 'Westicker Straße 16, 59174 Kamen', lat: 51.5792, lon: 7.6620, power: '11 kW AC', price: 0.38, city: 'Kamen' },
            { id: 'horsterstr', title: 'Horster Straße 83a (Werne)', address: 'Horster Straße 83a, 59368 Werne', lat: 51.6632, lon: 7.6372, power: '11 kW AC', price: 0.38, city: 'Werne' },
            { id: 'johannstr', title: 'Johann-Heuser-Straße 9 (Bergkamen)', address: 'Johann-Heuser-Straße 9, 59192 Bergkamen', lat: 51.6162, lon: 7.6325, power: '11 kW AC', price: 0.38, city: 'Bergkamen' },
            { id: 'campus', title: 'Campus 6 b/c (Selm)', address: 'Campus 6 b/c, 59379 Selm', lat: 51.7092, lon: 7.4675, power: '11 kW AC', price: 0.38, city: 'Selm' }
        ];

        function initApp() {
            const savedLat = parseFloat(localStorage.getItem('wbg_lat'));
            const savedLon = parseFloat(localStorage.getItem('wbg_lon'));
            const savedPlz = localStorage.getItem('wbg_plz');

            if (savedLat && savedLon) {
                userLat = savedLat;
                userLon = savedLon;
                if (savedPlz) document.getElementById('searchInput').value = savedPlz;
            }
            fetchWeather();
            processStations();
        }

        function fetchWeather() {
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=51.6074&longitude=7.5286&current=temperature_2m&timezone=auto`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.current) {
                        let temp = data.current.temperature_2m;
                        if (temp > 20) currentLossFactor = 1.04;
                        else if (temp >= 10) currentLossFactor = 1.07;
                        else if (temp >= 0) currentLossFactor = 1.12;
                        else currentLossFactor = 1.18;
                        
                        let lossPct = Math.round((currentLossFactor - 1) * 100);
                        document.getElementById('weatherInfoBadge').innerText = `Lünen: ${Math.round(temp)}°C (~${lossPct}% Verl.)`;
                        calculateAll();
                    }
                })
                .catch(() => {});
        }

        function setBatterySize(size) {
            document.getElementById('batterySizeInput').value = size;
            calculateAll();
        }

        function calculateMetrics() {
            let netCapacity = parseFloat(document.getElementById('batterySizeInput').value) || 60;
            let start = parseInt(document.getElementById('startSoc').value) || 20;
            let target = parseInt(document.getElementById('targetSoc').value) || 80;
            if (start >= target) target = start + 5;

            document.getElementById('startVal').innerText = start + '%';
            document.getElementById('targetVal').innerText = target + '%';

            let socDiff = target - start;
            let netKwh = (netCapacity * socDiff) / 100;
            let grossKwh = netKwh * currentLossFactor;
            let power = 11.0; 
            let hours = grossKwh / power;
            let totalMins = Math.round(hours * 60);
            let hrs = Math.floor(totalMins / 60);
            let mins = totalMins % 60;

            let now = new Date();
            let finishTime = new Date(now.getTime() + totalMins * 60000);
            let finishHours = String(finishTime.getHours()).padStart(2, '0');
            let finishMinutes = String(finishTime.getMinutes()).padStart(2, '0');
            let timeString = `${finishHours}:${finishMinutes}`;

            let durationStr = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
            let cost = (grossKwh * 0.38).toFixed(2);

            // Dashboard Hero Box aktualisieren
            document.getElementById('topFinishTime').innerText = `${timeString} Uhr`;
            document.getElementById('topDuration').innerText = `Ladezeit: ${durationStr}`;
            document.getElementById('topCostVal').innerText = cost;

            return { cost: cost, duration: durationStr };
        }

        function calculateAll() {
            processStations();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function toggleFavorite(id, event) {
            event.stopPropagation();
            const index = favorites.indexOf(id);
            if (index > -1) favorites.splice(index, 1);
            else favorites.push(id);
            localStorage.setItem('wbg_favorites', JSON.stringify(favorites));
            processStations();
        }

        function shareStation(title, address) {
            const shareText = `Ladesäule: ${title}\nAdresse: ${address}\nTarif: 0,38 €/kWh`;
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
            const fullShareString = `${shareText}\nNavigieren: ${mapsUrl}`;

            if (navigator.share) {
                navigator.share({ title: title, text: shareText, url: mapsUrl }).catch(() => {});
            } else {
                navigator.clipboard.writeText(fullShareString);
                alert("Daten in Zwischenablage kopiert!");
            }
        }

        function createCardHtml(st, isFav, isNearest, metrics) {
            const distText = st.distance < 1 ? (st.distance * 1000).toFixed(0) + ' m' : st.distance.toFixed(1) + ' km';
            const starClass = isFav ? "fa-solid text-amber-400" : "fa-regular text-gray-600 hover:text-amber-300";
            const mapsQueryUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(st.address)}`;

            return `
                <div class="bg-gray-900/80 border ${isNearest ? 'border-emerald-500/60 shadow-lg shadow-emerald-950/20' : 'border-gray-800/80'} rounded-xl p-2.5 space-y-2 transition">
                    <div class="flex items-start justify-between">
                        <div>
                            <div class="flex items-center space-x-1.5">
                                ${isNearest ? '<span class="bg-emerald-500 text-gray-950 text-[9px] font-black px-1.5 py-0.5 rounded tracking-wide">NÄCHSTE</span>' : ''}
                                <h3 class="font-bold text-xs ${st.custom ? 'text-emerald-400 font-extrabold' : 'text-gray-100'}">${st.title}</h3>
                            </div>
                            <p class="text-[11px] text-gray-400 truncate max-w-[210px] mt-0.5">${st.address}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="text-sm font-black text-emerald-400 tracking-tight">${metrics.cost} €</span>
                            <span class="text-[9px] text-gray-500 block font-medium">0,38 € / kWh</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between text-[11px] text-gray-400 pt-2 border-t border-gray-800/60">
                        <div class="flex items-center space-x-2.5">
                            <span class="text-gray-300 font-medium"><i class="fa-solid fa-location-dot text-emerald-500 mr-1"></i>${distText}</span>
                            <span class="text-gray-300 font-semibold"><i class="fa-solid fa-bolt text-amber-400 mr-1"></i>${st.power}</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="toggleFavorite('${st.id}', event)" class="p-1 text-sm"><i class="${starClass} fa-star"></i></button>
                            <button onclick="shareStation('${st.title}', '${st.address}')" class="text-emerald-400 hover:text-emerald-300 font-medium flex items-center space-x-1">
                                <i class="fa-solid fa-share-nodes"></i><span>Teilen</span>
                            </button>
                            <a href="${mapsQueryUrl}" target="_blank" class="text-blue-400 hover:text-blue-300 font-medium flex items-center space-x-1">
                                <i class="fa-solid fa-diamond-turn-right"></i><span>Navigieren</span>
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        function processStations() {
            const listContainer = document.getElementById('stationList');
            listContainer.innerHTML = '';

            const metrics = calculateMetrics();

            wbgStations = rawWbgData.map(st => {
                const dist = calculateDistance(userLat, userLon, st.lat, st.lon);
                return { ...st, distance: dist };
            });

            wbgStations.sort((a, b) => a.distance - b.distance);

            let filteredStations = wbgStations;
            if (currentFilter !== 'Alle') {
                filteredStations = wbgStations.filter(st => st.city === currentFilter);
            }

            document.getElementById('stationCount').innerText = `${filteredStations.length} von ${wbgStations.length} Standorten`;

            // Favoriten Sektion oben
            const favStations = wbgStations.filter(st => favorites.includes(st.id));
            if (favStations.length > 0) {
                const favSection = document.createElement('div');
                favSection.className = "bg-amber-500/10 border border-amber-500/30 rounded-xl p-2 space-y-1.5 mb-2";
                favSection.innerHTML = `<div class="text-[10px] font-bold text-amber-400 flex items-center space-x-1 px-1"><i class="fa-solid fa-star"></i><span>Favoriten (${favStations.length})</span></div>`;
                
                const favList = document.createElement('div');
                favList.className = "space-y-1.5";
                favStations.forEach(st => {
                    const cardWrapper = document.createElement('div');
                    cardWrapper.innerHTML = createCardHtml(st, true, false, metrics);
                    favList.appendChild(cardWrapper.firstElementChild);
                });
                favSection.appendChild(favList);
                listContainer.appendChild(favSection);
            }

            const headerTitle = document.createElement('div');
            headerTitle.className = "text-[10px] font-bold text-gray-500 uppercase tracking-wider px-1 pt-1";
            headerTitle.innerText = currentFilter === 'Alle' ? "Alle Standorte" : `Standorte in ${currentFilter}`;
            listContainer.appendChild(headerTitle);

            filteredStations.forEach((st, index) => {
                const isFav = favorites.includes(st.id);
                const isNearest = (currentFilter === 'Alle' && index === 0);

                const cardWrapper = document.createElement('div');
                cardWrapper.innerHTML = createCardHtml(st, isFav, isNearest, metrics);
                listContainer.appendChild(cardWrapper.firstElementChild);
            });
        }

        function setCityFilter(cityName) {
            currentFilter = cityName;
            ['Alle', 'Lünen', 'Kamen', 'Werne', 'Bergkamen', 'Selm'].forEach(city => {
                const btn = document.getElementById(`filter-${city}`);
                if (city === cityName) {
                    btn.className = "bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-bold shrink-0 transition";
                } else {
                    btn.className = "bg-gray-900 hover:bg-gray-800 text-gray-300 px-2.5 py-1 rounded-lg shrink-0 transition";
                }
            });
            processStations();
        }

        function setBaseLocation(query, lat, lon) {
            userLat = lat;
            userLon = lon;
            document.getElementById('searchInput').value = query;
            document.getElementById('locationLabel').innerText = query;
            localStorage.setItem('wbg_lat', userLat);
            localStorage.setItem('wbg_lon', userLon);
            localStorage.setItem('wbg_plz', query);

            processStations();
        }

        document.getElementById('searchBtn').onclick = async () => {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Deutschland')}`);
                const results = await res.json();
                if (results.length > 0) {
                    setBaseLocation(query, parseFloat(results[0].lat), parseFloat(results[0].lon));
                } else {
                    alert("Ort oder PLZ nicht gefunden.");
                }
            } catch (e) {}
        };

        document.getElementById('searchInput').onkeypress = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('searchBtn').click();
            }
        };

        document.getElementById('gpsBtn').onclick = () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    localStorage.setItem('wbg_lat', userLat);
                    localStorage.setItem('wbg_lon', userLon);
                    localStorage.setItem('wbg_plz', 'GPS');

                    document.getElementById('locationLabel').innerText = "GPS aktiv";
                    processStations();
                }, () => alert("GPS konnte nicht ermittelt werden."));
            }
        };

        document.getElementById('refreshBtn').onclick = () => {
            setBaseLocation('Winkel 13, Lünen', 51.5974, 7.4561);
            setCityFilter('Alle');
        };

        window.onload = initApp;
    </script>
</body>
</html>
