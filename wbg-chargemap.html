        function initApp() {
            const savedTheme = localStorage.getItem('wbg_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            // Erkennt gespeicherte Einstellung oder schaut auf das System (Dark/Light Mode)
            let currentTheme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
            
            if (currentTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = "fa-solid fa-moon text-xs";
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = "fa-solid fa-sun text-xs";
            }
            const savedCalcState = localStorage.getItem('wbg_calc_collapsed');
            if (savedCalcState === 'true') {
                document.getElementById('calculatorSection').classList.add('collapsed');
                document.getElementById('calcIcon').className = "fa-solid fa-calculator text-xs opacity-50";
            }
            requestGpsLocation(true);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('wbg_theme', 'light');
                document.getElementById('themeIcon').className = "fa-solid fa-sun text-xs";
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('wbg_theme', 'dark');
                document.getElementById('themeIcon').className = "fa-solid fa-moon text-xs";
            }
        }

        function requestGpsLocation(isAuto = false) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLat = pos.coords.latitude;
                        userLon = pos.coords.longitude;
                        fetchWeather();
                        processStations();
                    },
                    (error) => {
                        fetchWeather();
                        processStations();
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                fetchWeather();
                processStations();
            }
        }

        function fetchWeather() {
            if (weatherLoaded) return;
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${userLat}&longitude=${userLon}&current=temperature_2m&timezone=auto`)
                .then(res => res.json())
                .then(data => {
                    let temp = (data && data.current && data.current.temperature_2m !== undefined) ? data.current.temperature_2m : 15;
                    if (temp > 20) currentLossFactor = 1.04;
                    else if (temp >= 10) currentLossFactor = 1.07;
                    else if (temp >= 0) currentLossFactor = 1.12;
                    else currentLossFactor = 1.18;
                    weatherLoaded = true;
                    calculateMetrics();
                })
                .catch(() => {
                    currentLossFactor = 1.07;
                    calculateMetrics();
                });
        }

        function setBatterySize(size) {
            document.getElementById('batterySizeInput').value = size;
            [40, 60, 75, 100].forEach(s => {
                const btn = document.getElementById(`bat-${s}`);
                if (btn) {
                    if (s === size) {
                        btn.className = "bg-emerald-600 text-white border border-emerald-600 px-1.5 py-1 rounded-lg text-[10px] font-bold transition shadow-sm";
                    } else {
                        btn.className = "bg-gray-50 dark:bg-gray-900/80 hover:bg-gray-100 dark:hover:bg-gray-800 border border-gray-200/60 dark:border-gray-800/40 text-gray-700 dark:text-gray-300 px-1.5 py-1 rounded-lg text-[10px] font-semibold transition";
                    }
                }
            });
            calculateAll();
        }

        function calculateMetrics() {
            let netCapacity = parseFloat(document.getElementById('batterySizeInput').value) || 60;
            let start = parseInt(document.getElementById('startSoc').value) || 0;
            let target = parseInt(document.getElementById('targetSoc').value) || 0;
            
            if (start > target) {
                target = start;
            }

            document.getElementById('startVal').innerText = start + '%';
            document.getElementById('targetVal').innerText = target + '%';

            const startValEl = document.getElementById('startVal');
            startValEl.className = "font-bold ";
            if (start < 15) {
                startValEl.className += "text-red-500 dark:text-red-400";
            } else if (start <= 25) {
                startValEl.className += "text-amber-500 dark:text-amber-400";
            } else {
                startValEl.className += "text-gray-900 dark:text-white";
            }

            const targetValEl = document.getElementById('targetVal');
            targetValEl.className = "font-bold ";
            if (target < 50) {
                targetValEl.className += "text-amber-500 dark:text-amber-400";
            } else if (target <= 80) {
                targetValEl.className += "text-emerald-500 dark:text-emerald-400";
            } else {
                targetValEl.className += "text-emerald-600 dark:text-emerald-300 font-black";
            }

            let socDiff = target - start;
            let netKwh = (netCapacity * socDiff) / 100;
            let grossKwh = netKwh * currentLossFactor;
            
            const heroBg = document.getElementById('heroBatteryBg');
            const heroKwhSub = document.getElementById('heroKwhSub');
            if (heroBg) heroBg.style.width = target + '%';
            if (heroKwhSub) heroKwhSub.innerText = `${grossKwh.toFixed(1)} kWh geladen`;

            let power = 11.0; 
            let hours = grossKwh / power;
            let totalMins = Math.round(hours * 60);
            let hrs = Math.floor(totalMins / 60);
            let mins = totalMins % 60;

            let now = new Date();
            let finishTime = new Date(now.getTime() + totalMins * 60000);
            let finishHours = String(finishTime.getHours()).padStart(2, '0');
            let finishMinutes = String(finishTime.getMinutes()).padStart(2, '0');
            let timeString = `${finishHours}:${finishMinutes}`;

            let durationStr = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
            let cost = (grossKwh * 0.38).toFixed(2);

            document.getElementById('topFinishTime').innerText = `${timeString} Uhr`;
            document.getElementById('topDuration').innerText = `Ladezeit: ${durationStr}`;
            document.getElementById('topCostVal').innerText = cost;
            if (heroKwhSub) heroKwhSub.innerText = `${grossKwh.toFixed(1)} kWh geladen`;

            return { cost: cost, duration: durationStr };
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function toggleFavorite(id, event) {
            event.stopPropagation();
            const index = favorites.indexOf(id);
            if (index > -1) favorites.splice(index, 1);
            else favorites.push(id);
            try {
                localStorage.setItem('wbg_favorites', JSON.stringify(favorites));
            } catch (e) {}
            processStations();
        }

        function shareStation(title, address, kw, count, mapsUrl) {
            const shortMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(title + ', ' + address)}`;
            const shareText = `⚡ WBG Ladestation: ${title}\n📍 ${address}\n🔌 Leistung: ${kw} AC (${count} Ladepunkte)\n💰 Tarif: 0,38 € / kWh\n🗺️ Navigieren: ${shortMapsUrl}`;

            if (navigator.share) {
                navigator.share({ title: `WBG: ${title}`, text: shareText, url: shortMapsUrl }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText);
                alert("Ladedetails in die Zwischenablage kopiert!");
            }
        }

                                <span class="text-sm font-black text-emerald-600 dark:text-emerald-400 tracking-tight">${metrics.cost} €</span>
                                <span class="text-[9px] text-gray-400 dark:text-gray-500 block font-medium">0,38 € / kWh</span>
                            ` : `
                                <span class="text-xs font-bold text-gray-700 dark:text-gray-300 tracking-tight">0,38 €</span>
                                <span class="text-[9px] text-gray-400 dark:text-gray-500 block font-medium">pro kWh</span>

        function processStations() {
            const listContainer = document.getElementById('stationCardsContainer');
            listContainer.innerHTML = '';
            const metrics = calculateMetrics();

            wbgStations = rawWbgData.map(st => {
                const dist = calculateDistance(userLat, userLon, st.lat, st.lon);
                return { ...st, distance: dist };
            });

            wbgStations.sort((a, b) => a.distance - b.distance);
            const nearestStationId = wbgStations.length > 0 ? wbgStations[0].id : null;

            let filteredStations = wbgStations;
            if (currentFilter !== 'Alle') {
                filteredStations = wbgStations.filter(st => st.city === currentFilter);
            }

            document.getElementById('stationCount').innerText = `${filteredStations.length} von ${wbgStations.length} Standorten`;
            filteredStations = filteredStations.filter(st => !favorites.includes(st.id));

            const favStations = wbgStations.filter(st => favorites.includes(st.id));
            if (favStations.length > 0) {
                const favSection = document.createElement('div');
                favSection.className = "space-y-1.5 mb-3";
                favSection.innerHTML = `<div class="text-[10px] font-bold text-amber-500 dark:text-amber-400 uppercase tracking-wider px-1 pt-1 flex items-center space-x-1"><i class="fa-solid fa-star"></i><span>Favoriten (${favStations.length})</span></div>`;
                
                const favList = document.createElement('div');
                favList.className = "space-y-1.5";
                favStations.forEach(st => {
                    const isNearest = (st.id === nearestStationId);
                    const cardWrapper = document.createElement('div');
                    cardWrapper.innerHTML = createCardHtml(st, true, isNearest, metrics);
                    favList.appendChild(cardWrapper.firstElementChild);
                });
                favSection.appendChild(favList);
                listContainer.appendChild(favSection);
            }

            const headerTitle = document.createElement('div');
            headerTitle.className = "text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider px-1 pt-1";
            headerTitle.innerText = currentFilter === 'Alle' ? "Alle Standorte" : `Standorte in ${currentFilter}`;
            listContainer.appendChild(headerTitle);

            filteredStations.forEach((st) => {
                const isFav = favorites.includes(st.id);
                const isNearest = (st.id === nearestStationId);
                const cardWrapper = document.createElement('div');
                cardWrapper.innerHTML = createCardHtml(st, isFav, isNearest, metrics);
                listContainer.appendChild(cardWrapper.firstElementChild);
            });
        }

        function setCityFilter(cityName) {

            ['Alle', 'Lünen', 'Kamen', 'Werne', 'Bergkamen', 'Selm'].forEach(city => {

                    }
                }

            processStations();

        // Pull-to-Refresh Logic (Smooth Drag & Snap-back with Notification Feedback)
        let touchStartY = 0;
        let currentPull = 0;
        let isPulling = false;
        const stationListEl = document.getElementById('stationList');
        const refreshIndicator = document.getElementById('refreshIndicator');
        const refreshTextSpan = refreshIndicator ? refreshIndicator.querySelector('span span') : null;

        if (stationListEl && refreshIndicator) {
            stationListEl.addEventListener('touchstart', (e) => {
                if (stationListEl.scrollTop <= 0) {
                    touchStartY = e.touches[0] ? e.touches[0].clientY : 0;
                    isPulling = true;
                }
            }, { passive: true });

            stationListEl.addEventListener('touchmove', (e) => {
                if (!isPulling) return;
                const touchY = e.touches[0] ? e.touches[0].clientY : 0;
                currentPull = touchY - touchStartY;
                
                if (currentPull > 30 && stationListEl.scrollTop <= 0) {
                    refreshIndicator.classList.add('active-refresh');
                    let pullHeight = Math.min(currentPull * 0.5, 60);
                    refreshIndicator.style.maxHeight = pullHeight + 'px';
                }
            }, { passive: true });

            stationListEl.addEventListener('touchend', (e) => {
                if (!isPulling) return;
                isPulling = false;

                if (currentPull > 50 && stationListEl.scrollTop <= 0) {
                    if (navigator.vibrate) {
                        navigator.vibrate(50);
                    }

                    if (refreshTextSpan) refreshTextSpan.innerText = 'Standorte & Wetter aktualisiert!';
                    refreshIndicator.style.maxHeight = '60px';
                    refreshIndicator.classList.add('active-refresh');

                    weatherLoaded = false;
                    requestGpsLocation(false);

                    setTimeout(() => {
                        refreshIndicator.style.maxHeight = '0px';
                        refreshIndicator.classList.remove('active-refresh');
                        if (refreshTextSpan) {
                            setTimeout(() => {
                                refreshTextSpan.innerText = 'Standorte & Wetter aktualisiert!';
                            }, 300);
                        }
                    }, 1200);
                } else {
                    refreshIndicator.style.maxHeight = '0px';
                    refreshIndicator.classList.remove('active-refresh');
                }
                currentPull = 0;
            }, { passive: true });
        }

        
        function toggleCalculator() {
            const calcEl = document.getElementById('calculatorSection');
            const calcIcon = document.getElementById('calcIcon');
            if (calcEl.classList.contains('collapsed')) {
                calcEl.classList.remove('collapsed');
                calcIcon.className = "fa-solid fa-calculator text-xs";
                localStorage.setItem('wbg_calc_collapsed', 'false');
            } else {
                calcEl.classList.add('collapsed');
                calcIcon.className = "fa-solid fa-calculator text-xs opacity-50";
                localStorage.setItem('wbg_calc_collapsed', 'true');
            }
            processStations();
        }

        window.onload = initApp;
    </script>
</body>
</html>
