        .custom-scrollbar::-webkit-scrollbar { width: 3px; }

        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: #1f2937; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #10b981; cursor: pointer; box-shadow: 0 0 8px rgba(16, 185, 129, 0.5); }
    
        /* Tesla Batterie Animation & Gauge Styles */
        .battery-gauge-card {
            background: var(--card-inner, rgba(255,255,255,0.05));
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            position: relative;
        }
        .dark .battery-gauge-card {
            background: rgba(17, 24, 39, 0.6);
            border-color: rgba(255,255,255,0.08);
        }
        .gauge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gauge-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .gauge-charged-text {
            font-size: 11px;
            font-weight: 700;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .charge-pulse-icon {
            display: inline-block;
            animation: pulseBolt 1.6s ease-in-out infinite;
        }
        @keyframes pulseBolt {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #10b981); }
            50% { transform: scale(1.2); filter: drop-shadow(0 0 8px #10b981); }
        }
        .battery-frame-container {
            width: 100%;
            padding-right: 6px;
            box-sizing: border-box;
        }
        .battery-outer-frame {
            width: 100%;
            height: 32px;
            background: rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(107, 114, 128, 0.3);
            border-radius: 10px;
            padding: 2px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .battery-outer-frame::after {
            content: "";
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 12px;
            background: rgba(107, 114, 128, 0.5);
            border-radius: 0 2px 2px 0;
        }
        .battery-cell-ticks {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 4;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent calc(20% - 1px),
                rgba(255, 255, 255, 0.15) calc(20% - 1px),
                rgba(255, 255, 255, 0.15) 20%
            );
        }
        .battery-track {
            width: 100%;
            height: 100%;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            background: rgba(107, 114, 128, 0.1);
        }
        .battery-base-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            background: #9ca3af;
            border-radius: 6px 0 0 6px;
            transition: width 0.3s ease;
            z-index: 1;
        }
        .battery-charge-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            background: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
            border-radius: 0 6px 6px 0;
            transition: left 0.3s ease, width 0.3s ease;
            z-index: 2;
            overflow: hidden;
        }
        .charge-shimmer-wave {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.4) 50%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: shimmerWave 2.2s linear infinite;
            pointer-events: none;
        }
        @keyframes shimmerWave {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .battery-scale {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            font-weight: 600;
            color: #9ca3af;
            padding: 0 2px;
        }

            .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>

        function initApp() {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const defaultTheme = prefersDark ? 'dark' : 'light';
            const savedTheme = localStorage.getItem('wbg_theme') || defaultTheme;

            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = "fa-solid fa-sun text-xs";
            } else {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = "fa-solid fa-moon text-xs";
            }

            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    if (!localStorage.getItem('wbg_theme')) {
                        if (e.matches) {
                            document.documentElement.classList.add('dark');
                            document.getElementById('themeIcon').className = "fa-solid fa-moon text-xs";
                        } else {
                            document.documentElement.classList.remove('dark');
                            document.getElementById('themeIcon').className = "fa-solid fa-sun text-xs";
                        }
                    }
                });
            }

            requestGpsLocation(true);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('wbg_theme', 'light');
                document.getElementById('themeIcon').className = "fa-solid fa-sun text-xs";
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('wbg_theme', 'dark');
                document.getElementById('themeIcon').className = "fa-solid fa-moon text-xs";
            }
        }

        function requestGpsLocation(isAuto = false) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLat = pos.coords.latitude;
                        userLon = pos.coords.longitude;
                        localStorage.setItem('wbg_lat', userLat);
                        localStorage.setItem('wbg_lon', userLon);
                        fetchWeather();
                        processStations();
                    },
                    (error) => {
                        fetchWeather();
                        processStations();
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                fetchWeather();
                processStations();
            }
        }

        function fetchWeather() {
            if (weatherLoaded) return;
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=51.6074&longitude=7.5286&current=temperature_2m&timezone=auto`)
                .then(res => res.json())
                .then(data => {
                    let temp = 15;
                    if (data && data.current && data.current.temperature_2m !== undefined) {
                        temp = data.current.temperature_2m;
                    }
                    
                    if (temp > 20) currentLossFactor = 1.04;
                    else if (temp >= 10) currentLossFactor = 1.07;
                    else if (temp >= 0) currentLossFactor = 1.12;
                    else currentLossFactor = 1.18;
                    
                    let lossPct = Math.round((currentLossFactor - 1) * 100);
                    const badge = document.getElementById('weatherInfoBadge');
                    if (badge) badge.innerText = `Lünen: ${Math.round(temp)}°C (~${lossPct}% Verl.)`;
                    weatherLoaded = true;
                    calculateMetrics();
                })
                .catch(() => {
                    let temp = 15;
                    currentLossFactor = 1.07;
                    let lossPct = Math.round((currentLossFactor - 1) * 100);
                    const badge = document.getElementById('weatherInfoBadge');
                    if (badge) badge.innerText = `Lünen: ${Math.round(temp)}°C (~${lossPct}% Verl.)`;
                    calculateMetrics();
                });
        }

        function setBatterySize(size) {
            document.getElementById('batterySizeInput').value = size;
            calculateAll();
        }

        function calculateMetrics() {
            let netCapacity = parseFloat(document.getElementById('batterySizeInput').value) || 60;
            let start = parseInt(document.getElementById('startSoc').value) || 20;
            let target = parseInt(document.getElementById('targetSoc').value) || 80;
            if (start >= target) target = start + 5;

            document.getElementById('startVal').innerText = start + '%';
            document.getElementById('targetVal').innerText = target + '%';


            let socDiff = target - start;
            let netKwh = (netCapacity * socDiff) / 100;
            let grossKwh = netKwh * currentLossFactor;
            
            // Batterie-Animation im Hero-Header Update
            const heroBg = document.getElementById('heroBatteryBg');
            
            const heroKwhSub = document.getElementById('heroKwhSub');
            if (heroBg) heroBg.style.width = target + '%';
            
            if (heroKwhSub) heroKwhSub.innerText = `${grossKwh.toFixed(1)} kWh geladen`;

            let power = 11.0; 
            let hours = grossKwh / power;
            let totalMins = Math.round(hours * 60);
            let hrs = Math.floor(totalMins / 60);
            let mins = totalMins % 60;

            let now = new Date();
            let finishTime = new Date(now.getTime() + totalMins * 60000);
            let finishHours = String(finishTime.getHours()).padStart(2, '0');
            let finishMinutes = String(finishTime.getMinutes()).padStart(2, '0');
            let timeString = `${finishHours}:${finishMinutes}`;

            let durationStr = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
            let cost = (grossKwh * 0.38).toFixed(2);

            document.getElementById('topFinishTime').innerText = `${timeString} Uhr`;
            document.getElementById('topDuration').innerText = `Ladezeit: ${durationStr}`;
            document.getElementById('topCostVal').innerText = cost;

            return { cost: cost, duration: durationStr };
        }

        function calculateAll() {
            processStations();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function toggleFavorite(id, event) {
            event.stopPropagation();
            const index = favorites.indexOf(id);
            if (index > -1) favorites.splice(index, 1);
            else favorites.push(id);
            try {
                localStorage.setItem('wbg_favorites', JSON.stringify(favorites));
            } catch (e) {}
            processStations();
        }

        function shareStation(title, address, kw, count, mapsUrl) {
            const shortMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(title + ', ' + address)}`;
            const shareText = `⚡ WBG Ladestation: ${title}\n📍 ${address}\n🔌 Leistung: ${kw} AC (${count} Ladepunkte)\n💰 Tarif: 0,38 € / kWh\n🗺️ Navigieren: ${shortMapsUrl}`;

            if (navigator.share) {
                navigator.share({
                    title: `WBG: ${title}`,
                    text: shareText,
                    url: shortMapsUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText);
                alert("Ladedetails in die Zwischenablage kopiert!");
            }
        }

                function processStations() {
            const listContainer = document.getElementById('stationList');
            listContainer.innerHTML = `
                <div id="refreshIndicator" class="overflow-hidden transition-all duration-300 max-h-0 opacity-0 bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-center text-[11px] font-bold flex items-center justify-center space-x-2 py-0 rounded-xl my-0">
                    <div class="flex items-center space-x-1.5 py-1.5">
                        <i class="fa-solid fa-circle-notch fa-spin text-emerald-500"></i>
                        <span>Aktualisiere Standorte...</span>
                    </div>
                </div>
            `;

            const metrics = calculateMetrics();

            wbgStations = rawWbgData.map(st => {
                const dist = calculateDistance(userLat, userLon, st.lat, st.lon);
                return { ...st, distance: dist };
            });

            wbgStations.sort((a, b) => a.distance - b.distance);

            // Die absolut nächste Station im gesamten Datensatz ermitteln
            const nearestStationId = wbgStations.length > 0 ? wbgStations[0].id : null;

            let filteredStations = wbgStations;
            if (currentFilter !== 'Alle') {
                filteredStations = wbgStations.filter(st => st.city === currentFilter);
            }

            document.getElementById('stationCount').innerText = `${filteredStations.length} von ${wbgStations.length} Standorten`;

            // Favoriten oben in der Box anzeigen, daher in der Hauptliste unten nicht doppelt anzeigen
            filteredStations = filteredStations.filter(st => !favorites.includes(st.id));

            // Favoriten-Sektion oben (falls Favoriten vorhanden)
            const favStations = wbgStations.filter(st => favorites.includes(st.id));
            if (favStations.length > 0) {
                const favSection = document.createElement('div');
                favSection.className = "space-y-1.5 mb-3";
                favSection.innerHTML = `<div class="text-[10px] font-bold text-amber-500 dark:text-amber-400 uppercase tracking-wider px-1 pt-1 flex items-center space-x-1"><i class="fa-solid fa-star"></i><span>Favoriten (${favStations.length})</span></div>`;
                
                const favList = document.createElement('div');
                favList.className = "space-y-1.5";
                favStations.forEach(st => {
                    const isNearest = (st.id === nearestStationId);
                    const cardWrapper = document.createElement('div');
                    cardWrapper.innerHTML = createCardHtml(st, true, isNearest, metrics);
                    favList.appendChild(cardWrapper.firstElementChild);
                });
                favSection.appendChild(favList);
                listContainer.appendChild(favSection);
            }

            const headerTitle = document.createElement('div');
            headerTitle.className = "text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider px-1 pt-1";
            headerTitle.innerText = currentFilter === 'Alle' ? "Alle Standorte" : `Standorte in ${currentFilter}`;
            listContainer.appendChild(headerTitle);

            filteredStations.forEach((st) => {
                const isFav = favorites.includes(st.id);
                const isNearest = (st.id === nearestStationId);

                const cardWrapper = document.createElement('div');
                cardWrapper.innerHTML = createCardHtml(st, isFav, isNearest, metrics);
                listContainer.appendChild(cardWrapper.firstElementChild);
            });


        }

        function setCityFilter(cityName) {
            currentFilter = cityName;
            ['Alle', 'Lünen', 'Kamen', 'Werne', 'Bergkamen', 'Selm'].forEach(city => {
                const btn = document.getElementById(`filter-${city}`);
                if (city === cityName) {
                    btn.className = "bg-emerald-600 text-white px-1 py-1 rounded-lg font-bold flex-1 text-center text-[10px] transition";
                } else {
                    btn.className = "bg-gray-100 dark:bg-gray-900 hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300 px-1 py-1 rounded-lg flex-1 text-center text-[10px] transition";
                }
            });
            processStations();
        }

        let startY = 0;
        let isPulling = false;
        const stationListEl = document.getElementById('stationList');

        window.addEventListener('touchstart', (e) => {
            const scrollTop = stationListEl ? stationListEl.scrollTop : (window.pageYOffset || window.scrollY);
            if (scrollTop <= 2) {
                startY = e.touches[0].pageY;
                isPulling = true;
            } else {
                isPulling = false;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isPulling) return;
            let currentY = e.touches[0].pageY;
            const scrollTop = stationListEl ? stationListEl.scrollTop : (window.pageYOffset || window.scrollY);
            
            if (currentY - startY > 130 && scrollTop <= 2) {
                isPulling = false;
                const refreshEl = document.getElementById('refreshIndicator');
                if (refreshEl) {
                    refreshEl.style.maxHeight = '40px';
                    refreshEl.classList.remove('opacity-0');
                    refreshEl.classList.add('opacity-100', 'py-2');
                }
                const badge = document.getElementById('weatherInfoBadge');
                if (badge) badge.innerText = "Aktualisiere...";
                
                requestGpsLocation(true);
                weatherLoaded = false;
                fetchWeather();
                processStations();
                
                setTimeout(() => {
                    if (refreshEl) {
                        refreshEl.classList.remove('opacity-100', 'py-2');
                        refreshEl.classList.add('opacity-0');
                        refreshEl.style.maxHeight = '0px';
                    }
                }, 1600);
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            isPulling = false;
        }, { passive: true });

        window.onload = initApp;
    </script>
</body>
</html>
