<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { 
            --bg-color: #161616; 
            --card-bg: #2a2a2a; 
            --text-color: #ffffff; 
            --border-color: rgba(255, 255, 255, 0.1); 
            --accent-blue: #007AFF; 
            --live-red: #E82127; 
            --danger-red: #E82127; 
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Player-Container mit sanfter Ein-/Ausfahr-Animation */
        .player-wrapper {
            width: 100%;
            max-width: 900px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.5s ease-in-out, opacity 0.4s ease-in-out, margin-bottom 0.4s ease-in-out;
            margin-bottom: 0;
        }
        .player-wrapper.active {
            max-height: 600px;
            opacity: 1;
            margin-bottom: 20px;
        }

        .player-box { width: 100%; background: #000; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 10px; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* Steuerungsleiste (Start/Stop Button & Info) */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 14px;
        }
        .controls-bar span b { color: var(--accent-blue); }
        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn.stop { background: var(--danger-red); }
        .btn:hover { opacity: 0.9; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; width: 100%; max-width: 900px; }
        
        /* Kachel-Struktur im Radio-Stil mit Overlays */
        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 15px; 
            text-align: center; 
            cursor: pointer; 
            transition: border-color 0.2s; 
            position: relative;
            overflow: hidden;
        }
        .card:hover { border-color: var(--accent-blue); }
        .card b { font-size: 14px; }
        .card small { color: #aaa; font-size: 11px; display: block; margin-top: 2px; }

        /* Live Badge in Rot */
        .live-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background-color: var(--live-red);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            display: none;
            z-index: 25;
        }
        .card.playing .live-badge { display: block; }

        /* Radio-State Stopp-Overlay bei Wiedergabe */
        .radio-state-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 10;
        }
        .card.playing .radio-state-overlay { opacity: 1; }
        .radio-state-icon { color: #ffffff; width: 28px; height: 28px; }
    </style>
</head>
<body>
    <!-- Eingeklappter Player-Bereich -->
    <div class="player-wrapper" id="playerWrapper">
        <div class="player-box">
            <video id="videoPlayer" controls playsinline></video>
        </div>
        <div class="controls-bar">
            <span id="currentChannelInfo">Kein Sender ausgewählt</span>
            <button class="btn stop" id="togglePlayBtn" onclick="togglePlayback()">Stoppen</button>
        </div>
    </div>

    <div class="grid" id="channelsGrid"></div>

    <script>
        const channels = [
            { id: "ard", name: "Das Erste", url: "https://daserste-live.ard-mcdn.de/daserste/live/hls/de/master.m3u8", country: "ARD" },
            { id: "zdf", name: "ZDF", url: "https://zdf-hls-15.akamaized.net/hls/live/2016498/de/high/master.m3u8", country: "ZDF" },
            { id: "wdr", name: "WDR", url: "https://wdrfs247.akamaized.net/hls/live/681509/wdr_msl4_fs247/master.m3u8", country: "WDR" },
            { id: "ndr", name: "NDR", url: "https://mcdn.ndr.de/ndr/hls/ndr_fs/ndr_nds/master.m3u8", country: "NDR" },
            { id: "swr", name: "SWR", url: "https://swrbwd-hls.akamaized.net/hls/live/2018672/swrbwd/master.m3u8", country: "SWR" },
            { id: "br", name: "BR", url: "https://mcdn.br.de/br/fs/bfs_sued/hls/de/master.m3u8", country: "BR" },
            { id: "mdr", name: "MDR", url: "https://mdrtvsnhls.akamaized.net/hls/live/2016928/mdrtvsn/master.m3u8", country: "MDR" },
            { id: "hr", name: "HR", url: "https://hrhlsde.akamaized.net/hls/live/2024526/hrhlsde/index.m3u8", country: "HR" },
            { id: "rbb", name: "RBB", url: "https://rbb-hls-berlin.akamaized.net/hls/live/2017824/rbb_berlin/index.m3u8", country: "RBB" },
            { id: "tagesschau24", name: "Tagesschau24", url: "https://tagesschau.akamaized.net/hls/live/2020115/tagesschau/tagesschau_1/master.m3u8", country: "ARD" }
        ];

        const grid = document.getElementById('channelsGrid');
        const video = document.getElementById('videoPlayer');
        const playerWrapper = document.getElementById('playerWrapper');
        const channelInfo = document.getElementById('currentChannelInfo');
        const toggleBtn = document.getElementById('togglePlayBtn');
        let hls = null;
        let currentPlayingId = null;
        let currentUrl = null;
        let currentName = null;

        const stopSvgHTML = `<svg class="radio-state-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;

        channels.forEach(c => {
            let card = document.createElement('div');
            card.className = 'card';
            card.dataset.instanceId = c.id;
            card.innerHTML = `
                <div class="live-badge">LIVE</div>
                <div class="radio-state-overlay">${stopSvgHTML}</div>
                <b>${c.name}</b><br><small>${c.country}</small>
            `;
            card.onclick = () => handleCardClick(c);
            grid.appendChild(card);
        });

        function handleCardClick(channel) {
            if (currentPlayingId === channel.id && !video.paused) {
                pauseStream();
            } else {
                selectAndPlay(channel);
            }
        }

        function selectAndPlay(channel) {
            currentPlayingId = channel.id;
            currentUrl = channel.url;
            currentName = channel.name;
            
            channelInfo.innerHTML = `Aktiv: <b>${channel.name}</b>`;
            playerWrapper.classList.add('active');
            
            updatePlayingStates();
            playStream(channel.url);
        }

        function playStream(url) {
            if (hls) { hls.destroy(); }
            if (Hls.isSupported()) {
                hls = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    startLevel: -1,
                    enableWorker: true,
                    lowLatencyMode: false
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { 
                    video.play().catch(err => console.log("Autoplay blocked:", err));
                    setPlayState(true);
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                            case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                            default: hls.destroy(); break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() { 
                    video.play().catch(err => console.log("Autoplay blocked:", err));
                    setPlayState(true);
                });
            }
        }

        function pauseStream() {
            video.pause();
            if (hls) { hls.stopLoad(); }
            setPlayState(false);
            channelInfo.innerHTML = `Status: <b>Pausiert</b> (${currentName})`;
        }

        function togglePlayback() {
            if (!video.paused) {
                pauseStream();
            } else {
                if (currentUrl) {
                    playStream(currentUrl);
                    setPlayState(true);
                } else if (channels.length > 0) {
                    selectAndPlay(channels[0]);
                }
            }
        }

        function setPlayState(isPlaying) {
            if (isPlaying) {
                toggleBtn.textContent = "Stoppen";
                toggleBtn.className = "btn stop";
            } else {
                toggleBtn.textContent = "Starten";
                toggleBtn.className = "btn";
            }
            updatePlayingStates();
        }

        function updatePlayingStates() {
            document.querySelectorAll('.card').forEach(card => {
                if (card.dataset.instanceId === currentPlayingId && !video.paused) {
                    card.classList.add('playing');
                } else {
                    card.classList.remove('playing');
                }
            });
        }
    </script>
</body>
</html>
