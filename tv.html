<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg-color: #161616; --card-bg: #2a2a2a; --text-color: #ffffff; --border-color: rgba(255, 255, 255, 0.1); --accent-blue: #007AFF; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h2 { margin-bottom: 15px; font-weight: 500; }
        .player-box { width: 100%; max-width: 900px; background: #000; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 20px; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; width: 100%; max-width: 900px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
        .card:hover { border-color: var(--accent-blue); }
        .card b { font-size: 14px; }
        .card small { color: #aaa; font-size: 11px; }
    </style>
</head>
<body>
    <h2>📺 Tesla Live TV</h2>
    <div class="player-box">
        <video id="videoPlayer" controls autoplay muted playsinline></video>
    </div>
    <div class="grid" id="channelsGrid"></div>
    <script>
        const channels = [
            { name: "Test Stream (Sintel)", url: "https://bitmovin-a.akamaihd.net/content/sintel/hls/playlist.m3u8", country: "TEST" }
        ];
        const grid = document.getElementById('channelsGrid');
        const video = document.getElementById('videoPlayer');
        let hls = null;
        channels.forEach(c => {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<b>${c.name}</b><br><small>${c.country}</small>`;
            card.onclick = () => playStream(c.url);
            grid.appendChild(card);
        });
        function playStream(url) {
            if (hls) { hls.destroy(); }
            if (Hls.isSupported()) {
                hls = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    startLevel: -1,
                    enableWorker: true,
                    lowLatencyMode: false
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { 
                    video.play().catch(err => console.log("Autoplay blocked:", err)); 
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() { 
                    video.play().catch(err => console.log("Autoplay blocked:", err)); 
                });
            }
        }
        if(channels.length > 0) { playStream(channels[0].url); }
    </script>
</body>
</html>
