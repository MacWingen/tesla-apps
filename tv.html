<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Live TV</title>
    <!-- Clappr Player -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <style>
        :root {
            --bg-color: #161616;
            --card-bg: #2a2a2a;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-blue: #007AFF;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 15px; font-weight: 500; }
        .player-box {
            width: 100%;
            max-width: 900px;
            background: #000;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        #player { width: 100%; height: 100%; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 900px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: var(--accent-blue); }
        .card b { font-size: 14px; }
        .card small { color: #aaa; font-size: 11px; }
    </style>
</head>
<body>

    <h2>📺 Tesla Live TV</h2>
    
    <div class="player-box">
        <div id="player"></div>
    </div>

    <div class="grid" id="channelsGrid"></div>

    <script>
        let player = null;

        // Getestete, stabile HLS-Streams
        const channels = [
            { name: "ZDF HD", url: "https://zdf-hls-15.akamaized.net/hls/live/2016504/de/high/master.m3u8", country: "DE" },
            { name: "Das Erste HD", url: "https://mcdn.daserste.de/daserste/de/master.m3u8", country: "DE" },
            { name: "ARTE HD", url: "https://artelive-lh.akamaihd.net/i/arte_de@396072/index_1080_av-p.m3u8", country: "DE" },
            { name: "Phoenix HD", url: "https://zdf-hls-17.akamaized.net/hls/live/2016506/phoenix/high/master.m3u8", country: "DE" }
        ];

        const grid = document.getElementById('channelsGrid');
        channels.forEach(c => {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<b>${c.name}</b><br><small>${c.country}</small>`;
            card.onclick = () => playStream(c.url);
            grid.appendChild(card);
        });

        function playStream(url) {
            if (player) {
                player.destroy();
            }
            player = new Clappr.Player({
                source: url,
                parentId: "#player",
                autoPlay: true,
                width: "100%",
                height: "100%"
            });
        }
    </script>
</body>
</html>
