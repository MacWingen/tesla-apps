    <style>
        :root { 
            --bg-color: #161616; 
            --card-bg: #2a2a2a; 
            --text-color: #ffffff; 
            --border-color: rgba(255, 255, 255, 0.1); 
            --accent-blue: #007AFF; 
            --live-red: #E82127; 
            --danger-red: #E82127; 
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .player-wrapper {
            width: 100%;
            max-width: 900px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.5s ease-in-out, opacity 0.4s ease-in-out, margin-bottom 0.4s ease-in-out;
            margin-bottom: 0;
        }
        .player-wrapper.active {
            max-height: 600px;
            opacity: 1;
            margin-bottom: 20px;
        }

        .player-box { width: 100%; background: #000; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 10px; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 14px;
        }
        .controls-bar span b { color: var(--accent-blue); }
        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn.stop { background: var(--danger-red); }
        .btn:hover { opacity: 0.9; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; width: 100%; max-width: 900px; }
        
        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 15px; 
            text-align: center; 
            cursor: pointer; 
            transition: border-color 0.2s; 
            position: relative;
            overflow: hidden;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:hover { border-color: var(--accent-blue); }
        .card img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 6px; display: block; }
        .card b { font-size: 13px; line-height: 1.2; }

        .live-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background-color: var(--live-red);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            display: none;
            z-index: 25;
        }
        .card.playing .live-badge { display: block; }

        .radio-state-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 10;
        }
        .card.playing .radio-state-overlay { opacity: 1; }
        .radio-state-icon { color: #ffffff; width: 28px; height: 28px; }
    </style>
</head>

        const video = document.getElementById('videoPlayer');
        const playerWrapper = document.getElementById('playerWrapper');
        const channelInfo = document.getElementById('currentChannelInfo');
        const toggleBtn = document.getElementById('togglePlayBtn');

        let currentPlayingId = null;
        let currentUrl = null;
        let currentName = null;

        const stopSvgHTML = `<svg class="radio-state-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;

        channels.forEach(c => {
            let card = document.createElement('div');
            card.className = 'card';
            card.dataset.instanceId = c.id;
            
            let imgTag = c.logo ? `<img src="${c.logo}" alt="${c.name}">` : '';

            card.innerHTML = `
                <div class="live-badge">LIVE</div>
                <div class="radio-state-overlay">${stopSvgHTML}</div>
                ${imgTag}
                <b>${c.name}</b>
            `;
            card.onclick = () => handleCardClick(c);
            grid.appendChild(card);
        });

        function handleCardClick(channel) {
            if (currentPlayingId === channel.id && !video.paused) {
                pauseStream();
            } else {
                selectAndPlay(channel);
            }
        }

        function selectAndPlay(channel) {
            currentPlayingId = channel.id;
            currentUrl = channel.url;
            currentName = channel.name;
            
            channelInfo.innerHTML = `Aktiv: <b>${channel.name}</b>`;
            playerWrapper.classList.add('active');
            
            updatePlayingStates();
            playStream(channel.url);
        }

            });
        }

        function disableSubtitles() {
            for (let i = 0; i < video.textTracks.length; i++) {
                video.textTracks[i].mode = 'disabled';
            }
        }

        function playStream(url) {
            if (hls) { hls.destroy(); }
            if (Hls.isSupported()) {
                hls = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    startLevel: -1,
                    enableWorker: true,
                    lowLatencyMode: false
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { 
                    disableSubtitles();
                    video.play().catch(err => console.log("Autoplay blocked:", err));
                    setPlayState(true);
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                            case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                            default: hls.destroy(); break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() { 
                    disableSubtitles();
                    video.play().catch(err => console.log("Autoplay blocked:", err));
                    setPlayState(true);
                });
            }
        }

        function pauseStream() {
            video.pause();
            if (hls) { hls.stopLoad(); }
            setPlayState(false);
            channelInfo.innerHTML = `Status: <b>Pausiert</b> (${currentName})`;
        }

        function togglePlayback() {
            if (!video.paused) {
                pauseStream();
            } else {
                if (currentUrl) {
                    playStream(currentUrl);
                    setPlayState(true);
                } else if (channels.length > 0) {
                    selectAndPlay(channels[0]);
                }
            }
        }

        function setPlayState(isPlaying) {
            if (isPlaying) {
                toggleBtn.textContent = "Stoppen";
                toggleBtn.className = "btn stop";
            } else {
                toggleBtn.textContent = "Starten";
                toggleBtn.className = "btn";
            }
            updatePlayingStates();
        }

        function updatePlayingStates() {
            document.querySelectorAll('.card').forEach(card => {
                if (card.dataset.instanceId === currentPlayingId && !video.paused) {
                    card.classList.add('playing');
                } else {
                    card.classList.remove('playing');
                }
            });
        }
    </script>
</body>
</html>
